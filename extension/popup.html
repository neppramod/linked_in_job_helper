<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.45 system-ui, "Segoe UI", sans-serif; width: 360px; margin: 0; color: #1f1f1f; }
    .top { padding: 12px 14px 4px; }
    .row { margin: 3px 0; word-break: break-word; }
    .label { color: #666; display: block; }
    input[type=text] { width: 100%; box-sizing: border-box; font: 13px system-ui, sans-serif; padding: 5px 7px;
      border: 1px solid #ccc; border-radius: 5px; margin: 2px 0 6px; }
    input.missing { border-color: #a1001b; background: #fde4e4; }
    .pill { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600; border: 1px solid; }
    .Strong { color: #0b5d26; background: #e3f6e8; border-color: #7cc791; }
    .Mixed { color: #8a4b00; background: #fff2db; border-color: #e8b766; }
    .Weak { color: #a1001b; background: #fde4e4; border-color: #ec8f8f; }
    #status { font-weight: 600; margin: 8px 14px; min-height: 18px; }
    .ok { color: #0b5d26; } .err { color: #a1001b; }
    .buttons { display: flex; gap: 8px; padding: 4px 14px 12px; flex-wrap: wrap; }
    button { font: 600 13px system-ui, sans-serif; padding: 7px 12px; border-radius: 6px; border: 1px solid #0f766e;
      background: #fff; color: #0f766e; cursor: pointer; }
    button.primary { background: #0f766e; color: #fff; }
    button.danger { border-color: #a1001b; color: #a1001b; }
    button:disabled { opacity: .5; cursor: default; }
    .setup { background: #fff2db; color: #8a4b00; padding: 8px 14px; font-weight: 600; }
    .setup a { color: #8a4b00; }
    footer { border-top: 1px solid #e5e5e5; padding: 8px 14px; display: flex; gap: 14px; }
    footer a { color: #0f766e; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <div id="setup" class="setup" hidden>Setup isn't finished. <a id="openSetup">Open Settings</a></div>
  <div id="noFolder" class="setup" hidden>No folder chosen yet, so Chrome asks where to save each file.
    <div style="margin-top:6px"><button id="openFolder" class="primary">Choose folder…</button></div></div>
  <div class="top">
    <label class="label" for="company">Company</label>
    <input id="company" type="text" placeholder="Company name">
    <label class="label" for="title">Job title</label>
    <input id="title" type="text" placeholder="Job title">
    <div class="row"><span class="label" style="display:inline">Link:</span> <span id="link">…</span></div>
    <div class="row" id="fitRow" hidden><span class="label" style="display:inline">Fit:</span> <span id="fit"></span> <span id="salary"></span></div>
  </div>
  <div id="status"></div>
  <div class="buttons">
    <button id="save" class="primary" disabled>Save job</button>
    <button id="letter" disabled>Cover letter</button>
    <button id="remove" class="danger" hidden>Remove</button>
    <button id="allow" class="primary" hidden>Allow</button>
  </div>
  <footer>
    <a id="openTracker">Tracker</a>
    <a id="openSettings">Settings</a>
  </footer>
  <script src="settings-store.js"></script>
  <script src="shared.js"></script>
  <script src="pdf.js"></script>
  <script src="files.js"></script>
  <script src="popup.js"></script>
</body>
</html>
